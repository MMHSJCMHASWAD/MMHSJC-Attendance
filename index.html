<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#19457f">
<meta name="description" content="MMHSJC Monthly Attendance Register">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>MMHSJC Attendance</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fb;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f3f6fb;color:#19457f;font-weight:700}
.spinner{width:42px;height:42px;margin-bottom:14px;border:4px solid #dce5f1;border-top-color:#19457f;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#installButton{display:none;position:fixed;z-index:20;right:15px;bottom:15px;padding:13px 18px;border:0;border-radius:25px;background:#19457f;color:#fff;font-weight:700}
</style></head><body>
<div id="loading"><div class="spinner"></div>MMHSJC Attendance</div>
<iframe id="attendanceApp" src="https://script.google.com/macros/s/AKfycbya54QOygB3UkjQ0YQkQAA4oy81agPrDdNRFpTz9Yd7oCKPlrLX2Nf61KuAEnoEE2pH/exec" allow="clipboard-write" title="MMHSJC Attendance"></iframe>
<button id="installButton">📲 Install App</button>
<script>
const frame=document.getElementById('attendanceApp'),loading=document.getElementById('loading'),installButton=document.getElementById('installButton');
let deferredPrompt=null;
frame.addEventListener('load',()=>setTimeout(()=>loading.style.display='none',400));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.log));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installButton.style.display='block'});
installButton.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installButton.style.display='none'});
window.addEventListener('appinstalled',()=>{installButton.style.display='none';deferredPrompt=null});
</script></body></html>
